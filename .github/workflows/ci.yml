# Checks every PR and every push to main with the same mise tasks as locally. Pushes to main
# also build the image and push it to the private ghcr.io/landazuripaul/unblogexutoire,
# tagged with the short commit hash and latest. Deploying stays manual (see README).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Base mise config only: Go, not the local dev tools (gopls)
  MISE_ENV: ""

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install: true
          cache: true
      - run: mise run vet
      - run: mise run test

  image:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install: true
          cache: true
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run image:push
